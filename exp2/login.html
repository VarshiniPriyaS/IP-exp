<!DOCTYPE html>

<html>

<head>

<title>Login - Fashion Store</title>

<style>

body{

background-color:#EAF6FF;

font-family:Arial, sans-serif;

text-align:center;

}

form{

width:320px;

margin:auto;

background:white;

padding:20px;

border-radius:10px;

box-shadow:0px 0px 10px gray;

}

input{

width:90%;

padding:10px;

margin:10px;

}

input[type=submit]{

background:#28A745;

color:white;

border:none;

cursor:pointer;

}

input[type=submit]:hover{

background:#218838;

}

a{

text-decoration:none;

color:blue;

}

</style>

</head>

<body>

<h1>FASHION STORE</h1>

<h2>User Login</h2>

<form action="home.html">

<input type="email" placeholder="Enter Email" required><br>

<input type="password" placeholder="Enter Password" required><br>

<input type="submit" value="Login">

</form>

<p>New User?</p>

<a href="register.html">Create New Account</a>

</body>

</html>
