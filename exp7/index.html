<!DOCTYPE html>
<html>
<head>
    <title>Session Tracking</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f3ff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            width: 400px;
            background: white;
            border-radius: 25px;
            padding: 40px;
            box-shadow: 0 15px 40px rgba(80, 60, 120, 0.18);
        }

        .icon {
            width: 65px;
            height: 65px;
            margin: auto;
            border-radius: 50%;
            background: #7c3aed;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
        }

        h1 {
            text-align: center;
            margin: 18px 0 5px;
            color: #292524;
        }

        .text {
            text-align: center;
            color: #78716c;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #44403c;
            font-weight: bold;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 13px;
            border: 1px solid #d6d3d1;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 15px;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #7c3aed;
        }

        input[type="submit"] {
            width: 100%;
            padding: 14px;
            background: #7c3aed;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        input[type="submit"]:hover {
            background: #5b21b6;
        }

        .info {
            text-align: center;
            margin-top: 22px;
            font-size: 12px;
            color: #a8a29e;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="icon"></div>

        <h1>Session Tracking</h1>

        <p class="text">
            Java Servlet Session Management
        </p>

        <form action="HiddenFieldServlet1" method="get">

            <label>Name</label>
            <input type="text"
                   name="uname"
                   placeholder="Enter your name"
                   required>

            <label>Password</label>
            <input type="password"
                   name="password"
                   placeholder="Enter your password"
                   required>

            <input type="submit" value="Continue">

        </form>

        <div class="info">
            Secure Session Tracking Demonstration
        </div>

    </div>

</body>
</html>
